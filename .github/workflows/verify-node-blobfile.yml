name: Verify Node BlobFile methods

on:
  push:
    branches:
      - verify/node-blobfile-seek-read-ranges
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: nodejs
    env:
      CC: gcc-12
      CXX: g++-12
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_CI_DEBUG: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Make swap
        working-directory: .
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: nodejs/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev
      - name: Format Rust
        run: cargo fmt --all -- --check
      - name: Lint Rust (Node crate)
        run: cargo clippy --profile ci -p lancedb-nodejs --all-features -- -D warnings
      - name: Lint Typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm lint-ci
      - name: Build
        run: |
          pnpm build:debug --profile ci
          pnpm tsc
      - name: Regenerate docs
        run: |
          pnpm run docs
          git diff --stat -- ../ ':(exclude)Cargo.lock'
          git diff -- ../ ':(exclude)Cargo.lock' > ../docs.patch
      - uses: actions/upload-artifact@v4
        with:
          name: docs-patch
          path: docs.patch
      - name: Blob tests
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: node_modules/.bin/jest --verbose __test__/blob.test.ts __test__/table.test.ts -t "blob"
      - name: Disk usage
        if: always()
        working-directory: .
        run: |
          df -h /
          du -sh target || true
